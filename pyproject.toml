[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostport"
version = "0.1.0"
description = "Migration slicer and workbench paired with GhostSlice. Planner only: no codemods, no auto-fixes, no code rewriting."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ghostport = "ghostport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostport = ["packs/*.json"]
