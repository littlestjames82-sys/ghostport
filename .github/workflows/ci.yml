name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        # tests/fixtures/ordering_project is a fixture project the suite
        # feeds to GhostPort as input; its own test file is not part of
        # this suite and is excluded from collection.
        run: python -m pytest -q --ignore=tests/fixtures/ordering_project
